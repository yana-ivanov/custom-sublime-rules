name: "Link: Framer-hosted page with credential phishing indicators"
description: |
  Detects emails containing links to Framer-hosted pages (*.framer.app,
  *.framer.website, or pages with framerusercontent.com CDN fingerprint)
  combined with credential phishing intent from unsolicited senders.

  Framer is a legitimate no-code website builder used by designers, startups,
  and enterprise teams. Its free tier allows instant publishing with no
  verification — attackers can create convincing phishing pages in minutes
  at zero cost on a trusted domain. Email security tools see a reputable
  platform; the malicious content is assembled after the victim clicks.

  Documented campaign (August 2026): multi-stage phishing using Framer pages
  combined with Cloudflare Workers for redirection and HTML smuggling via
  the Blob API. Payload assembled in browser memory — never touches disk
  or file scanners. Confirmed malicious Framer pages documented on PhishStats
  May-July 2026, clustered on the same IP range suggesting organized campaigns.

  Also targets the job application workflow — fake candidate submits a Framer
  portfolio link in a PDF resume. Hiring managers clicking portfolio links
  are the intended victims. The link is checked in BOTH the email body AND
  embedded in PDF attachments to cover both delivery vectors.

  Detection layers:
  1. Free tier: *.framer.app or *.framer.website URL in body or PDF attachment
  2. Paid tier with custom domain: framerusercontent.com CDN fingerprint
     in final DOM via ml.link_analysis() — survives meta tag removal

  Reference: https://yanaivanov.com/writing/framer_field_note.html
type: "rule"
severity: "high"
source: |
  type.inbound

  and (
    // Layer 1a — Framer free tier URL in email body
    any(body.links,
        .href_url.domain.root_domain in ("framer.app", "framer.website")
        and (
          // credential phishing NLU on the linked page
          ml.link_analysis(.).credphish.disposition == "phishing"
          or ml.link_analysis(.).credphish.confidence in ("medium", "high")
          // OR final DOM contains framerusercontent CDN — confirms Framer
          // even when custom domain used on paid tier
          or strings.icontains(ml.link_analysis(.).final_dom.raw,
                               "framerusercontent.com"
          )
        )
    )

    // Layer 1b — Framer link embedded inside PDF attachment
    // covers fake resume/portfolio submission attack vector
    or any(filter(attachments, .file_type == "pdf"),
           any(file.explode(.),
               any(.scan.pdf.urls,
                   .domain.root_domain in ("framer.app", "framer.website")
               )
           )
    )

    // Layer 2 — Framer CDN fingerprint on custom domain
    // catches paid tier users who removed the generator meta tag
    or any(body.links,
           strings.icontains(
             ml.link_analysis(.).final_dom.raw,
             "framerusercontent.com"
           )
           and ml.link_analysis(.).credphish.disposition == "phishing"
           and .href_url.domain.root_domain not in (
             "framer.app",
             "framer.website",
             "framer.com",
             "framerusercontent.com"
           )
    )
  )

  // negate highly trusted sender domains unless they fail DMARC
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )

