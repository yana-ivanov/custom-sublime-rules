name: "Link: Azure Blob Storage hosted credential phishing page from unsolicited sender"
description: |
  Detects emails containing links to Azure Blob Storage (blob.core.windows.net)
  combined with Microsoft brand impersonation or credential theft signals from
  unsolicited senders.

  Azure Blob Storage is a legitimate Microsoft cloud storage service that allows
  anyone to create publicly accessible containers and upload files including HTML
  pages. Attackers upload credential harvesting pages to blob containers and send
  phishing emails linking to them. The page sits on blob.core.windows.net — a
  Microsoft domain with a Microsoft wildcard SSL certificate — which passes every
  domain reputation check and displays a valid padlock in the browser.

  This technique bypasses standard email security controls because:
  - blob.core.windows.net has excellent domain reputation
  - The SSL certificate is issued by Microsoft itself
  - SPF, DKIM, and DMARC checks on the sending email are unrelated to the linked page
  - Enterprise proxy allowlists frequently permit blob.core.windows.net without inspection

  Confirmed active campaigns (2025-2026):
  - Microsoft 365 login page impersonation with pre-filled victim email address
  - OneDrive and SharePoint file-sharing lures redirecting to credential harvest
  - Entra ID authentication page impersonation
  - Per-victim link tokenization — unique URLs generated per target

  Sources: Microsoft Threat Intelligence blog (October 2025), Nopal Cyber threat
  advisory (October 2025), CYFIRMA cloud-native phishing campaign analysis (May 2026),
  PhishWire campaign monitoring (May 2026).

  Existing rule (spam_blob_core_from_new_dom.yml) covers only spam from domains
  under 30 days old with a single non-org recipient. This rule covers the broader
  pattern — established senders, organizational recipients, credential theft intent.

  Reference: https://yanaivanov.com/analysis/trust_tax_analysis.html

type: "rule"
severity: "high"
source: |
  type.inbound

  // link to Azure Blob Storage
  and any(body.links,
          .href_url.domain.root_domain == "windows.net"
          and strings.icontains(.href_url.domain.subdomain, "blob.core")
  )

  // combined with credential theft or Microsoft impersonation signals
  and (
    // NLU detects credential theft intent
    any(ml.nlu_classifier(body.current_thread.text).intents,
        .name == "cred_theft" and .confidence in ("medium", "high")
    )

    // OR Microsoft brand impersonation in sender or subject
    or regex.icontains(sender.display_name,
                       '\bMicrosoft\b|\bOneDrive\b|\bSharePoint\b|\bOutlook\b|\bOffice\s*365\b|\bAzure\b|\bEntra\b'
    )
    or regex.icontains(subject.subject,
                       '\bMicrosoft\b|\bOneDrive\b|\bSharePoint\b|\bOutlook\b|\bOffice\s*365\b|\bAzure\b|\bEntra\b'
    )

    // OR document/file sharing lure language
    or regex.icontains(body.current_thread.text,
                       'shared.*(?:document|file|folder|report)',
                       '(?:view|open|access|download).*(?:document|file|report)',
                       'sign in to (?:view|access|download)',
                       'verify your (?:identity|account|email)',
                       '(?:your|this) (?:document|file) (?:is|has been) shared'
    )
  )

  // unsolicited sender with no prior benign history
  and not profile.by_sender().solicited
  and not profile.by_sender().any_messages_benign

  // negate legitimate Microsoft communications
  and not (
    sender.email.domain.root_domain in (
      "microsoft.com",
      "microsoftonline.com",
      "sharepointonline.com",
      "office.com",
      "outlook.com",
      "azure.com"
    )
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )

  // negate highly trusted sender domains unless they fail DMARC
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )

